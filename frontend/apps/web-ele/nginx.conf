server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 上传（intel 原文/附件等）需要放宽默认 1m 限制
  client_max_body_size 50m;

  # 前端使用 hash 路由（VITE_ROUTER_HISTORY=hash），try_files 仅作兜底
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 同源反代到 backend：前端构建用 VITE_GLOB_API_URL=/api/v1，
  # 浏览器请求 /api/v1/... 由本 nginx 转发到容器网络内的 backend:8000 —— 免 CORS。
  # 用 ^~ 保证优先于下面的静态资源正则 location。
  location ^~ /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 回测/因子计算等接口可能较慢
    proxy_read_timeout 300s;
  }

  # 静态资源长缓存（vite 产物文件名带 hash）
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
