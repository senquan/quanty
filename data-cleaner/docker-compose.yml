# data-cleaner 独立部署
# 用法: docker compose up -d
# 如需独立 PG，取消 postgres 段注释；默认复用外部 PG（设置 DATABASE_URL 环境变量）
services:
  redis:
    image: redis:7-alpine
    container_name: data-cleaner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 可选：独立 PG（默认注释，复用既有 quant_db）
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: data-cleaner-postgres
  #   environment:
  #     POSTGRES_USER: quant_user
  #     POSTGRES_PASSWORD: quant_password
  #     POSTGRES_DB: quant_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

  data-cleaner:
    build: .
    container_name: data-cleaner
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://quant_user:quant_password@postgres:5432/quant_db}
      REDIS_URL: redis://redis:6379/0
      FACTOR_DATA_DIR: /data/factors
      QUARANTINE_DIR: /data/quarantine
      TZ: Asia/Shanghai
      DEBUG: "false"
    ports:
      - "8100:8100"
    volumes:
      - ./data/factors:/data/factors
      - ./data/quarantine:/data/quarantine
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
