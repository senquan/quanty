version: '3.8'

# 统一日志策略：json-file + 轮转（每容器最多 10 × 50MiB）。
# 目的：容器日志**长期落盘**且不撑爆磁盘；排查问题时能查到重启前的历史。
# （2026-09-11 排查 WS 长连接静默失效时，曾因日志被覆盖而取不到首次触发的证据，
#   见 docs/memo/2026-09-11.ws-reconnect-reliability.md §6）
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

services:
  postgres:
    image: postgres:15
    container_name: quant-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: quant_db
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
    # 不对宿主/公网暴露端口（仅容器网络可达）。
    # 如需本机 psql 调试，改为 "127.0.0.1:5432:5432"（只绑回环，勿用 0.0.0.0）。
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 注：原先挂的 ./backend/init:/docker-entrypoint-initdb.d 已移除
      #（该目录不存在，且部署时是用 pg_restore 恢复 dump，不依赖 init 脚本）。
    networks:
      - quant-network

  postgres-factor:
    # data-cleaner 专用库（factor schema）。与 backend 分库，两服务只能通过 HTTP 交互。
    image: postgres:15
    container_name: quant-postgres-factor
    logging: *default-logging
    environment:
      POSTGRES_DB: factor_db
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
    # 同上：不对宿主暴露；如需调试改 "127.0.0.1:5433:5432"
    volumes:
      - postgres_factor_data:/var/lib/postgresql/data
    networks:
      - quant-network

  backend:
    build: ./backend
    container_name: quant-backend
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://quant_user:quant_password@postgres:5432/quant_db
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "False"
      # 交易调度：backend 为控制中心，调度器只在单一实例启用。
      # 多副本部署时只能有一个实例设为 true，否则会重复触发调仓。
      ENABLE_TRADING_SCHEDULER: "true"
      BROKER_MODE: "paper"
      BROKER_DRY_RUN: "true"
      # WS 长连接：backend 为服务端，dc 主动连入（覆盖度命令通道 /
      # 因子变更广播 / QoS 推送）。关闭则相关能力静默失效。
      WS_ENABLED: "true"
      # 内部令牌（**权威字段**）：必须与 data-cleaner 的 STRATEGY_INTERNAL_TOKEN 一致。
      # 生产通过宿主环境变量 WS_TOKEN 注入（勿用默认值）。
      STRATEGY_INTERNAL_TOKEN: ${WS_TOKEN:-strat_int_change_me}
      # 前端经 frontend 的 nginx 同源反代 /api → backend，浏览器不发跨域请求；
      # 若前端独立域名直连后端，再在此补 ALLOWED_ORIGINS。
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # WS 在线时跳过 HTTP 轮询（降为 5min 兜底）
      CLEANER_POLL_SKIP_CONNECTED: "true"
      # 因子底册同步（单实例开启）
      ENABLE_FACTOR_SYNC: "true"
      # intel 上传代转发目标（容器内地址）
      INTEL_CLEANER_BASE_URL: http://data-cleaner:8100
    # 只绑宿主回环：backend 由 frontend 的 nginx 经容器网络访问，无需公网直连；
    # 本机调试可直接 curl 127.0.0.1:8000。
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
    networks:
      - quant-network
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]

  redis:
    image: redis:7-alpine
    container_name: quant-redis
    logging: *default-logging
    # 不对宿主暴露；如需调试改 "127.0.0.1:6379:6379"
    networks:
      - quant-network

  data-cleaner:
    build: ./data-cleaner
    container_name: quant-data-cleaner
    logging: *default-logging
    environment:
      # 指向独立的 factor 库，不是 backend 的 quant_db
      DATABASE_URL: postgresql+asyncpg://quant_user:quant_password@postgres-factor:5432/factor_db
      REDIS_URL: redis://redis:6379/0
      FACTOR_DATA_DIR: /data/factors
      DEBUG: "False"
      TZ: Asia/Shanghai
      # WS 长连接：dc 作客户端连入 backend 服务端。
      # WS_SERVICE_CODE 必须与 backend 注册的 cleaner_services.service_code 一致，
      # 否则命令通道按 service_code 找不到连接（覆盖度查看/修复会返回 503）。
      WS_ENABLED: "true"
      BACKEND_WS_URL: ws://backend:8000/ws/dc
      WS_INSTANCE_ID: dc-1
      WS_SERVICE_CODE: cleaner_dev
      STRATEGY_INTERNAL_TOKEN: ${WS_TOKEN:-strat_int_change_me}
    # dc 仅内网可达（backend 经容器网络访问 8100），不对宿主/公网暴露端口。
    volumes:
      - factor_data:/data/factors
    depends_on:
      - postgres-factor
      - redis
    networks:
      - quant-network
    command: ["sh", "-c", "python -c \"import asyncio, app.storage.db as d; asyncio.run(d.apply_migrations())\" && uvicorn app.main:app --host 0.0.0.0 --port 8100"]

  frontend:
    # QuanT 前端（@vben/web-ele）：nginx 托管静态资源，并把 /api 同源反代到 backend
    # （前端构建用 VITE_GLOB_API_URL=/api/v1，故无 CORS 问题）。
    # 注意 build context 必须是 frontend/（monorepo 需根 pnpm 工作区文件）。
    build:
      context: ./frontend
      dockerfile: apps/web-ele/Dockerfile
    container_name: quant-frontend
    logging: *default-logging
    # 只绑宿主回环，由宿主 Nginx/Caddy 承接 443/TLS 后转发（唯一公网入口）。
    # 若不用宿主反代，可改回 "8080:8080" 并用安全组限制来源。
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    networks:
      - quant-network

volumes:
  postgres_data:
  postgres_factor_data:
  factor_data:

networks:
  quant-network:
    driver: bridge
